name: Windows CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: PowerShell and safety tests
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install test tools
        shell: pwsh
        run: |
          Set-PSRepository -Name PSGallery -InstallationPolicy Trusted
          Install-Module Pester -MinimumVersion 5.5.0 -Scope CurrentUser -Force -SkipPublisherCheck
          Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          winget install --id Gitleaks.Gitleaks --exact --source winget --accept-package-agreements --accept-source-agreements --disable-interactivity
          if (-not (Get-Command gitleaks -ErrorAction SilentlyContinue)) {
            $wingetLinks = Join-Path $env:LOCALAPPDATA 'Microsoft\WinGet\Links'
            $env:PATH = "$wingetLinks;$env:PATH"
          }
          $gitleaksCommand = Get-Command gitleaks -ErrorAction Stop
          Split-Path -Parent $gitleaksCommand.Source | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Parse every PowerShell script
        shell: pwsh
        run: |
          $allErrors = @()
          Get-ChildItem -Path . -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors) {
              $allErrors += $parseErrors
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }

      - name: Parse and smoke test with Windows PowerShell 5.1
        shell: powershell
        run: |
          if ($PSVersionTable.PSVersion.Major -ne 5) {
            throw "Expected Windows PowerShell 5.1, found $($PSVersionTable.PSVersion)."
          }

          $allErrors = @()
          Get-ChildItem -Path . -Filter '*.ps1' -Recurse | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile(
              $_.FullName,
              [ref]$tokens,
              [ref]$parseErrors
            ) | Out-Null
            if ($parseErrors) {
              $allErrors += $parseErrors
            }
          }
          if ($allErrors.Count -gt 0) {
            $allErrors | Format-List | Out-String | Write-Error
            exit 1
          }

          $smokeRoot = Join-Path $env:RUNNER_TEMP 'vibe-runbooks-ps51-smoke'
          New-Item -ItemType Directory -Path (Join-Path $smokeRoot 'state') -Force | Out-Null
          Copy-Item .\state\progress-template.json (Join-Path $smokeRoot 'state\progress-template.json')
          . .\scripts\lib.ps1
          $script:RunbookRoot = $smokeRoot
          $linePath = Join-Path $smokeRoot 'ignore'
          Add-LineOnce -Path $linePath -Line '.env' | Out-Null
          Add-LineOnce -Path $linePath -Line '.env' | Out-Null
          Mark-RunbookStep 'ci:ps51-smoke'
          Set-RunbookArtifact -Name 'ciUrl' -Value 'https://example.test'
          $state = Read-RunbookState
          if (@($state.completedSteps) -notcontains 'ci:ps51-smoke') { throw 'State marker was not saved.' }
          if ((Get-RunbookArtifact -Name 'ciUrl') -ne 'https://example.test') { throw 'Artifact was not saved.' }
          if (@(Get-Content -LiteralPath $linePath).Count -ne 1) { throw 'Add-LineOnce was not idempotent.' }
          Remove-Item -LiteralPath $smokeRoot -Recurse -Force

      - name: Analyze PowerShell
        shell: pwsh
        run: |
          $results = @(Invoke-ScriptAnalyzer -Path . -Recurse -Settings .\PSScriptAnalyzerSettings.psd1)
          if ($results.Count -gt 0) {
            $results | Format-Table -AutoSize
          }
          $blocking = @($results | Where-Object Severity -eq 'Error')
          if ($blocking.Count -gt 0) {
            throw 'PSScriptAnalyzer found blocking errors.'
          }

      - name: Run command guard self-test
        shell: pwsh
        run: python .\scripts\command-guard.py --selftest

      - name: Run Pester
        shell: pwsh
        run: |
          $configuration = New-PesterConfiguration
          $configuration.Run.Path = '.\tests'
          $configuration.Run.Exit = $true
          $configuration.Output.Verbosity = 'Detailed'
          $configuration.TestResult.Enabled = $true
          $configuration.TestResult.OutputPath = 'TestResults\pester.xml'
          Invoke-Pester -Configuration $configuration

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pester-results
          path: TestResults/pester.xml
          if-no-files-found: ignore
